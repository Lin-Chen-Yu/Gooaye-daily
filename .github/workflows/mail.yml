name: Gooaye Mail

on:
  # 補寄：SMTP 偶發失敗時 mail.sent 不會寫，下一輪排程會自動再試
  schedule:
    # 每半小時到 Gmail 收 Claude 的講解原稿並寄出；SMTP 失敗時下一輪自動補寄
    # 03:37~05:07 UTC = 11:37~13:07 台北
    - cron: '7,37 3,4,5 * * *'
  push:
    paths:
      - 'out/**/mail.html'
  workflow_dispatch:
    inputs:
      date:
        description: '只寄指定日期（留空 = 掃描全部未寄的）'
        required: false
        default: ''
      force:
        description: '忽略 mail.sent 強制重寄'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: gooaye-mail
  cancel-in-progress: false

jobs:
  mail:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch Claude draft from Gmail
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python relay_fetch.py

      - name: Send pending mail
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO:            ${{ secrets.MAIL_TO }}
          # 用環境變數傳，不要把 ${{ }} 直接展開進 shell 指令列：
          # push 觸發時 inputs 是空的，會留下空的續行反斜線。
          IN_DATE:  ${{ github.event.inputs.date }}
          IN_FORCE: ${{ github.event.inputs.force }}
        run: |
          ARGS=""
          [ -n "$IN_DATE" ] && ARGS="$ARGS $IN_DATE"
          [ "$IN_FORCE" = "true" ] && ARGS="$ARGS --force"
          echo "send_mail.py$ARGS"
          python send_mail.py $ARGS

      # mail.sent 必須推回 repo，否則下次觸發會重寄。
      - name: Commit mail.sent
        if: always()
        run: |
          git config user.name  "gooaye-bot"
          git config user.email "gooaye-bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "沒有變更"
          else
            git commit -m "mail sent $(TZ=Asia/Taipei date +%Y-%m-%d\ %H:%M) 台北"
            for i in 1 2 3 4 5; do
              git push && break
              echo "push 被拒（第 $i 次），rebase 後重試"
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME:-main}" || git rebase --abort
              sleep $((i * 3))
            done
            git push || { echo "::error::mail.sent 推送失敗，可能重寄"; exit 1; }
          fi

      # 保險 2：連 SMTP 重試 + 補寄排程都失敗（step 已紅），改開 GitHub Issue，
      # 內文附完整講解。GitHub 會用它自己的通知系統寄信給 repo 擁有者，與 Gmail SMTP 無關。
      # 同一天只開一張，之後每輪補寄仍失敗也不會重複開。
      - name: Failsafe - open GitHub issue if mail still unsent
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for d in out/????-??-??; do
            [ -f "$d/mail.html" ] && [ ! -f "$d/mail.sent" ] || continue
            date=$(basename "$d")
            title="寄信失敗：$date"
            if [ -n "$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')" ]; then
              echo "$date 已有 open issue，略過"; continue
            fi
            {
              echo "Gmail SMTP 重試與補寄都失敗，以下是原本要寄的講解（圖片請看 repo 的 \`$d/media/\`）。"
              echo "修好後可到 Actions 手動執行 **Gooaye Mail** 補寄（date 填 $date）。"
              echo; echo "**主旨：** $(cat "$d/mail_subject.txt" 2>/dev/null)"; echo; echo '---'
              head -c 60000 "$d/mail.html"
            } > /tmp/body.md
            gh issue create --title "$title" --body-file /tmp/body.md
          done
