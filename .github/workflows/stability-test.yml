name: Stability Test

# 臨時測試：每 5 分鐘寄一封狀態信，台北時間 15:00 後自動停止。測完可整檔刪除。
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stability-test
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Time window (until 15:00 Taipei on 2026-09-29)
        id: win
        run: |
          NOW=$(TZ=Asia/Taipei date +%Y%m%d%H%M)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ "$NOW" -ge 202609291400 ] && [ "$NOW" -lt 202609291500 ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "視窗外，略過"
          fi
      - uses: actions/checkout@v4
        if: steps.win.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.win.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.win.outputs.run == 'true'
      - name: Ping
        if: steps.win.outputs.run == 'true'
        env:
          TG_API_ID:   ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION:  ${{ secrets.TG_SESSION }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO:            ${{ secrets.MAIL_TO }}
        run: python tools/stability_ping.py
