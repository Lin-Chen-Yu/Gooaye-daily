name: Stability Test

# 臨時測試：單一 job 內每 5 分鐘寄一封狀態信，台北時間 15:00 自動停止。測完可整檔刪除。
# 不用 cron：GitHub 的 */5 排程實測完全沒觸發，靠 workflow_dispatch 啟動。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stability-test
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ping every 5 min until 15:00 Taipei
        env:
          TG_API_ID:   ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION:  ${{ secrets.TG_SESSION }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO:            ${{ secrets.MAIL_TO }}
        run: |
          while [ "$(TZ=Asia/Taipei date +%Y%m%d%H%M)" -lt 202609291500 ]; do
            python tools/stability_ping.py || echo "ping 失敗，5 分鐘後重試"
            sleep 300
          done
          echo "已到 15:00 台北，結束"
