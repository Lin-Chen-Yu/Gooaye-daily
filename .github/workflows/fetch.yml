name: Gooaye Fetch

on:
  schedule:
    # 每天 07:00 台北抓取。GitHub 的 cron 會延遲、甚至整個被丟掉（實測 */5 完全沒觸發），
    # 所以用多個錯開的非整點時段互為備援；guard 步驟保證同一天成功後其餘跳過。
    # 22:53 / 23:17 / 23:47 UTC = 06:53 / 07:17 / 07:47 台北；主要觸發是下面的 push / dispatch。
    - cron: '53 22 * * *'
    - cron: '17 23 * * *'
    - cron: '47 23 * * *'
  push:
    branches: [main]
    paths:
      - 'trigger/fetch.txt'
  workflow_dispatch:
    inputs:
      hours:
        description: '往回抓幾小時（補抓時可填 130）'
        required: false
        default: '26'

permissions:
  contents: write

concurrency:
  group: gooaye-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 非手動觸發（schedule / push）時，若今天已經 OK 就跳過；手動觸發一律執行
      - name: Guard (skip if today already OK)
        id: guard
        run: |
          TODAY=$(TZ=Asia/Taipei date +%F)
          SKIP=$(python3 -c "import json;s=json.load(open('status.json'));print('true' if s.get('status')=='OK' and s.get('date')=='$TODAY' else 'false')" 2>/dev/null || echo false)
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && SKIP=false
          echo "skip=$SKIP" | tee -a "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.guard.outputs.skip != 'true'

      - name: Fetch channel
        if: steps.guard.outputs.skip != 'true'
        env:
          TG_API_ID:   ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION:  ${{ secrets.TG_SESSION }}
        run: python fetch.py ${{ github.event.inputs.hours || '26' }}

      # 即使抓取失敗也要 commit，因為 status.json 裡的 FAIL 是下游唯一的失敗訊號。
      - name: Commit results
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          git config user.name  "gooaye-bot"
          git config user.email "gooaye-bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "沒有變更，略過 commit"
          else
            git commit -m "fetch $(TZ=Asia/Taipei date +%Y-%m-%d\ %H:%M) 台北"
            # 別的 workflow / Claude 可能同時推了 commit；被拒就 rebase 後重推
            for i in 1 2 3 4 5; do
              git push && break
              echo "push 被拒（第 $i 次），rebase 後重試"
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME:-main}" || git rebase --abort
              sleep $((i * 3))
            done
            git push || { echo "::error::push 失敗，status.json 沒送上去"; exit 1; }
          fi

      # 最後才讓 job 變紅，這樣 GitHub 會寄失敗通知信給你，而 status.json 也已經推上去了。
      - name: Fail job if fetch failed
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          python - <<'PY'
          import json, sys
          s = json.load(open('status.json', encoding='utf-8'))
          print(f"status={s['status']} date={s['date']} count={s['count']}")
          if s['status'] != 'OK':
              print(f"error: {s['error']}")
              sys.exit(1)
          PY
